name: Update leaderboard data

on:
  workflow_dispatch: {} # triggered externally every 15 min by cron-job.org — see README

# GitHub's own schedule: trigger used to be enabled here too, as a backup.
# It's removed now: it fired independently of cron-job.org's precise 15-min
# cadence, and the two occasionally landed minutes apart — close enough
# that the concurrency group below (which only keeps the newest queued run)
# would cancel whichever arrived first. That was generating the "run
# failed"/"run cancelled" emails. cron-job.org alone has run reliably for
# 100+ consecutive triggers, so a backup trigger isn't worth the collision
# risk.
permissions:
  contents: write

# Belt-and-suspenders: keeps two runs from ever executing in parallel and
# racing to git push, even though there's only one trigger source now.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python scripts/fetch_and_update.py

      - name: Commit and push data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update leaderboard data"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i) — rebasing onto latest and retrying"
            git fetch origin main
            git rebase origin/main || { echo "Rebase failed"; git rebase --abort; exit 1; }
            sleep $(( (RANDOM % 5) + 1 ))
          done
          echo "Failed to push after retries"
          exit 1
