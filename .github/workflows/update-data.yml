name: Update leaderboard data

on:
  schedule:
    - cron: "*/15 * * * *" # every 15 minutes
  workflow_dispatch: {}

permissions:
  contents: write

# The external cron-job.org trigger and this native schedule can both fire
# close together; without this, two overlapping runs race to git push and
# the second one gets rejected. This serializes runs instead of racing them.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python scripts/fetch_and_update.py

      - name: Commit and push data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update leaderboard data"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i) — rebasing onto latest and retrying"
            git fetch origin main
            git rebase origin/main || { echo "Rebase failed"; git rebase --abort; exit 1; }
            sleep $(( (RANDOM % 5) + 1 ))
          done
          echo "Failed to push after retries"
          exit 1
